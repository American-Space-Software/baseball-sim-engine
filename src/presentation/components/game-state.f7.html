<style>

<script>

export default (props, { $h }) => {

    let vm = props.vm
    let gameViewService = props.gameviewservice
    let fieldImageUrl = props.fieldimageurl
    let getPlayerImageUrl = props.getplayerimageurl
    let getPlayerHref = props.getplayerhref
    let getBoxscoreHref = props.getboxscorehref
    let getGameLogHref = props.getgameloghref
    let advanceCallback = props.advancecallback
    let pauseCallback = props.pausecallback
    let resumeCallback = props.resumecallback
    let simToEndCallback = props.simtoendcallback
    let awayColor = props.awaycolor || "#0A3161"
    let homeColor = props.homecolor || "#B31942"

    const getFontColor = color => {
        const value = String(color).replace("#", "")
        const r = parseInt(value.substring(0, 2), 16)
        const g = parseInt(value.substring(2, 4), 16)
        const b = parseInt(value.substring(4, 6), 16)

        return r * 0.299 + g * 0.587 + b * 0.114 > 160 ? "#000000" : "#ffffff"
    }

    let awayFontColor = getFontColor(awayColor)
    let homeFontColor = getFontColor(homeColor)

    const getLineupPlayers = team => {
        return team.lineupIds.map(playerId => team.players.find(player => player._id === playerId)).filter(player => player)
    }

    const getRatingBadgeColor = rating => {
        if (rating == null) return "color-gray"
        if (rating >= 146) return "color-green"
        if (rating >= 122) return "color-blue"
        if (rating >= 83) return "color-yellow"
        if (rating >= 47) return "color-orange"
        return "color-red"
    }

    const ratingToGrade = rating => {
        if (rating == null) return ""
        if (rating >= 170) return "A+"
        if (rating >= 158) return "A"
        if (rating >= 146) return "A-"
        if (rating >= 134) return "B+"
        if (rating >= 122) return "B"
        if (rating >= 110) return "B-"
        if (rating >= 95) return "C+"
        if (rating >= 83) return "C"
        if (rating >= 71) return "C-"
        if (rating >= 59) return "D+"
        if (rating >= 47) return "D"
        if (rating >= 35) return "D-"
        return "F"
    }

    const advance = async () => {
        if (advanceCallback) {
            await advanceCallback()
        }
    }

    const pause = async () => {
        if (pauseCallback) {
            await pauseCallback()
        }
    }

    const resume = async () => {
        if (resumeCallback) {
            await resumeCallback()
        }
    }

    const simToEnd = async () => {
        if (simToEndCallback) {
            await simToEndCallback()
        }
    }

    return $render

}

</script>
