<template>

  <div class="game-page">

    ${gameViewModel?.game ? $h`

      <${GameState}
        vm=${gameViewModel}
        gameviewservice=${gameViewService}
        fieldimageurl=${fieldImageUrl}
        getplayerimageurl=${getPlayerImageUrl}
        getplayerhref=${getPlayerHref}
        getboxscorehref=${getBoxscoreHref}
        getgameloghref=${getGameLogHref}
        paused=${paused}
        advancecallback=${advanceCallback}
        pausecallback=${pauseCallback}
        resumecallback=${resumeCallback}
        simtoendcallback=${simToEndCallback}
      />

      <div class="popup box-score-popup popup-tablet-fullscreen">
        <div class="view">
          <div class="page">
            <div class="navbar">
              <div class="navbar-bg"></div>
              <div class="navbar-inner">
                <div class="title">Box Score</div>
                <div class="right">
                  <a class="link popup-close">Close</a>
                </div>
              </div>
            </div>

            <div class="page-content">
              <div class="game-banner">
                <div class="linescore-wrapper">
                  <${LineScore}
                    vm=${gameViewModel.linescore}
                  />
                </div>
              </div>

              <div class="grid grid-cols-1 large-grid-cols-2">
                <${Boxscore}
                  substitutions=${gameViewModel.game.substitutions ?? []}
                  vm=${gameViewModel.awayBoxscore}
                  boxscoreservice=${boxscoreService}
                  getplayerimageurl=${getPlayerImageUrl}
                  getplayerhref=${getPlayerHref}
                />

                <${Boxscore}
                  substitutions=${gameViewModel.game.substitutions ?? []}
                  vm=${gameViewModel.homeBoxscore}
                  boxscoreservice=${boxscoreService}
                  getplayerimageurl=${getPlayerImageUrl}
                  getplayerhref=${getPlayerHref}
                />
              </div>
            </div>
          </div>
        </div>
      </div>

    ` : $h`
      <div class="block">No game found.</div>
    `}

  </div>

</template>

<style>


</style>

<script>

import Boxscore from "./boxscore.f7.html"
import GameState from "./game-state.f7.html"
import LineScore from "./linescore.f7.html"

export default (props, { $onMounted, $onUpdated, $onBeforeUnmount, $, $f7, $update }) => {

    let gameWebService = props.gamewebservice
    let gameViewService = props.gameviewservice
    let gameMessageService = props.gamemessageservice
    let boxscoreService = props.boxscoreservice
    let game = props.game
    let fieldImageUrl = props.fieldimageurl
    let getPlayerImageUrl = props.getplayerimageurl
    let getPlayerHref = props.getplayerhref
    let getBoxscoreHref = props.getboxscorehref
    let getGameLogHref = props.getgameloghref
    let paused = props.paused === true
    let advanceCallback = props.advancecallback
    let pauseCallback = props.pausecallback
    let resumeCallback = props.resumecallback
    let simToEndCallback = props.simtoendcallback

    let gameViewModel = game ? gameWebService.getGameViewModel(game) : undefined
    let messagesComponent
    let messageSyncVersion = 0
    let messageSyncQueue = Promise.resolve()
    let allPopups = [".at-bat-ended"]
    let syncedGame = game

    const updateGameViewModel = () => {
        if (!game) {
            gameViewModel = undefined
            return
        }

        const updatedViewModel = gameWebService.getGameViewModel(game)

        if (!gameViewModel) {
            gameViewModel = updatedViewModel
            return
        }

        Object.assign(gameViewModel, updatedViewModel)
    }

    const showPopup = popup => {
        for (const item of allPopups) {
            if (item !== popup) $(item).hide()
        }

        $(popup).css("display", "flex")
    }

    const closeAllPopups = () => {
        for (const popup of allPopups) {
            $(popup).hide()
        }
    }

    const syncPopup = (atBatState, descriptions) => {
        if (atBatState === "ENDED") {
            const result = descriptions.find(description => description.type === "RESULT")?.text ?? ""

            $(".at-bat-ended .result").text(result)
            showPopup(".at-bat-ended")

            return
        }

        closeAllPopups()
    }

    const getMessages = descriptions => gameViewService.getMessagesFromPlayDescriptions(descriptions)

    const getMessagesComponent = () => {
        const existing = $f7.messages?.get(".game-messages")

        if (existing) {
            return existing
        }

        return $f7.messages?.create({
            el: ".game-messages",
            scrollMessages: true,
            scrollMessagesOnEdge: true
        })
    }

    const syncMessages = async (allMessages, showDelay) => {
        if (!messagesComponent) {
            return
        }

        const existingMessages = messagesComponent.messages ?? []
        const sync = gameMessageService.getSync(existingMessages, allMessages)

        messageSyncVersion++

        const version = messageSyncVersion

        messageSyncQueue = messageSyncQueue.then(async () => {
            if (version !== messageSyncVersion) {
                return
            }

            if (sync.clear) {
                messagesComponent.clear()
            }

            for (const message of sync.messages) {
                if (version !== messageSyncVersion) {
                    return
                }

                if (showDelay) {
                    messagesComponent.showTyping()
                    await delay(500)
                }

                if (version !== messageSyncVersion) {
                    return
                }

                messagesComponent.addMessage(message)
                messagesComponent.hideTyping()
            }
        })

        await messageSyncQueue
    }

    const syncGameUi = async showDelay => {
        if (!game) {
            return
        }

        const descriptions = gameWebService.getCurrentDescriptions(game)
        const allMessages = getMessages(descriptions)
        const atBatState = gameWebService.getAtBatState(game)

        syncPopup(atBatState, descriptions)
        await syncMessages(allMessages, showDelay)
    }

    const syncProps = async () => {
        paused = props.paused === true
        advanceCallback = props.advancecallback
        pauseCallback = props.pausecallback
        resumeCallback = props.resumecallback
        simToEndCallback = props.simtoendcallback

        if (props.game === syncedGame) {
            return
        }

        game = props.game
        syncedGame = props.game

        updateGameViewModel()
        await syncGameUi(false)
    }

    const delay = milliseconds => new Promise(resolve => setTimeout(resolve, milliseconds))
    const nextFrame = () => new Promise(resolve => requestAnimationFrame(resolve))

    $onMounted(async () => {
        if (!game) {
            return
        }

        updateGameViewModel()
        await $update()
        await nextFrame()
        await nextFrame()

        messagesComponent = getMessagesComponent()

        await syncGameUi(false)

        if (messagesComponent) {
            messagesComponent.scroll(0)
        }
    })

    $onUpdated(async () => {
        await syncProps()
    })

    $onBeforeUnmount(() => {
        messageSyncVersion++
        closeAllPopups()
    })

    return $render
}

</script>
