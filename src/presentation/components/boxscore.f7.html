<template>

  <div class="block block-outline block-strong game-boxscore-card">

    <div
      class="game-setup-team-header game-boxscore-team-header"
      style="--team-color: ${teamColor}; --team-text-color: ${teamTextColor};"
    >
      <span class="game-setup-team-badge">${vm.team.abbrev}</span>
      <div class="game-setup-team-heading">
        <div class="game-setup-team-side">${vm.side === "AWAY" ? "Away" : "Home"}</div>
        <div class="game-setup-team-name">${vm.team.name ?? vm.team.abbrev}</div>
      </div>
    </div>

    <div class="block-title game-setup-section-title game-boxscore-section-title">
      Batting
    </div>

    <div class="stat-table-wrapper game-boxscore-table-wrapper">
      <table class="data-table players game-setup-table game-table game-boxscore-table">

        <thead>
          <tr>
            <th class="image"></th>
            <th class="name">Player</th>
            <th class="position-cell">POS</th>
            <th class="stat">AB</th>
            <th class="stat">R</th>
            <th class="stat">H</th>
            <th class="stat">2B</th>
            <th class="stat">3B</th>
            <th class="stat">HR</th>
            <th class="stat">RBI</th>
            <th class="stat">BB</th>
            <th class="stat">HBP</th>
            <th class="stat">SO</th>
          </tr>
        </thead>

        <tbody>

          ${info.batters.map(row => $h`
            <tr class="${getBatterClass(row.player)}">

              <td class="image">
                ${getPlayerImageUrl ? $h`
                  <img src="${getPlayerImageUrl(row.player)}" />
                ` : ` `}
              </td>

              <td class="name">
                ${row.subNumber ? `${row.subNumber}-` : ` `}

                ${getPlayerHref ? $h`
                  <a href="${getPlayerHref(row.player)}">${row.player.fullName}</a>
                ` : row.player.fullName}
              </td>

              <td class="position-cell">${row.player.currentPosition}</td>
              <td class="stat">${row.player.hitResult.atBats}</td>
              <td class="stat">${row.player.hitResult.runs}</td>
              <td class="stat">${row.player.hitResult.hits}</td>
              <td class="stat">${row.player.hitResult.doubles}</td>
              <td class="stat">${row.player.hitResult.triples}</td>
              <td class="stat">${row.player.hitResult.homeRuns}</td>
              <td class="stat">${row.player.hitResult.rbi}</td>
              <td class="stat">${row.player.hitResult.bb}</td>
              <td class="stat">${row.player.hitResult.hbp}</td>
              <td class="stat">${row.player.hitResult.so}</td>

            </tr>
          `)}

        </tbody>

      </table>
    </div>


    <div class="block-title game-setup-section-title game-boxscore-section-title">
      Pitching
    </div>

    <div class="stat-table-wrapper game-boxscore-table-wrapper">
      <table class="data-table players game-setup-table game-table game-boxscore-table">

        <thead>
          <tr>
            <th class="image"></th>
            <th class="name">Player</th>
            <th class="position-cell">POS</th>
            <th class="stat">W</th>
            <th class="stat">L</th>
            <th class="stat">IP</th>
            <th class="stat">H</th>
            <th class="stat">R</th>
            <th class="stat">ER</th>
            <th class="stat">HR</th>
            <th class="stat">BB</th>
            <th class="stat">SO</th>
            <th class="stat">HBP</th>
            <th class="stat">BF</th>
            <th class="stat">PIT</th>
            <th class="stat">STR</th>
          </tr>
        </thead>

        <tbody>

          ${info.pitchers.map(row => $h`
            <tr class="${getPitcherClass(row.player)}">

              <td class="image">
                ${getPlayerImageUrl ? $h`
                  <img src="${getPlayerImageUrl(row.player)}" />
                ` : ` `}
              </td>

              <td class="name">
                ${row.subNumber ? `${row.subNumber}-` : ` `}

                ${getPlayerHref ? $h`
                  <a href="${getPlayerHref(row.player)}">${row.player.fullName}</a>
                ` : row.player.fullName}
              </td>

              <td class="position-cell">${row.player.currentPosition}</td>
              <td class="stat">${row.player.pitchResult.wins}</td>
              <td class="stat">${row.player.pitchResult.losses}</td>
              <td class="stat">${row.player.pitchResult.ip}</td>
              <td class="stat">${row.player.pitchResult.hits}</td>
              <td class="stat">${row.player.pitchResult.runs}</td>
              <td class="stat">${row.player.pitchResult.er}</td>
              <td class="stat">${row.player.pitchResult.homeRuns}</td>
              <td class="stat">${row.player.pitchResult.bb}</td>
              <td class="stat">${row.player.pitchResult.so}</td>
              <td class="stat">${row.player.pitchResult.hbp}</td>
              <td class="stat">${row.player.pitchResult.battersFaced}</td>
              <td class="stat">${row.player.pitchResult.pitches}</td>
              <td class="stat">${row.player.pitchResult.strikes}</td>

            </tr>
          `)}

        </tbody>

      </table>
    </div>


    <div class="batter-summary game-boxscore-summary">

      ${info.doubles.length > 0 ? $h`
        <strong>2B:</strong> ${arrayToString(info.doubles)}<br />
      ` : ` `}

      ${info.triples.length > 0 ? $h`
        <strong>3B:</strong> ${arrayToString(info.triples)}<br />
      ` : ` `}

      ${info.homeRuns.length > 0 ? $h`
        <strong>HR:</strong> ${arrayToString(info.homeRuns)}<br />
      ` : ` `}

      ${info.totalBases.length > 0 ? $h`
        <strong>TB:</strong> ${arrayToString(info.totalBases)}<br />
      ` : ` `}

      ${info.rbi.length > 0 ? $h`
        <strong>RBI:</strong> ${arrayToString(info.rbi)}<br />
      ` : ` `}

    </div>

  </div>

</template>

<style>


</style>

<script>

export default (props) => {

    let vm = props.vm
    let substitutions = props.substitutions ?? []
    let boxscoreService = props.boxscoreservice
    let getPlayerImageUrl = props.getplayerimageurl
    let getPlayerHref = props.getplayerhref
    let teamColor = props.teamcolor ?? "var(--f7-theme-color)"
    let teamTextColor = props.teamtextcolor ?? "#ffffff"

    const info = boxscoreService.getBoxscoreInfo(substitutions, vm)

    const arrayToString = (values) => {
        return values.map(value => `${value.name}${value.value > 1 ? ` ${value.value}` : ""}`).join("; ")
    }

    const getBatterClass = (player) => {
        if (vm.isComplete) {
            return ""
        }

        if (vm.team.lineupIds[vm.team.currentHitterIndex] !== player._id) {
            return ""
        }

        const batting = vm.isTopInning && vm.side === "AWAY" || !vm.isTopInning && vm.side === "HOME"

        return batting ? "at-bat" : "at-bat-next"
    }

    const getPitcherClass = (player) => {
        if (vm.isComplete || vm.team.currentPitcherId !== player._id) {
            return ""
        }

        const pitching = vm.isTopInning && vm.side === "HOME" || !vm.isTopInning && vm.side === "AWAY"

        return pitching ? "pitching" : ""
    }

    return $render

}
</script>
